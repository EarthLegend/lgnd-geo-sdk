# The one lint: `make lint` and CI run these hooks on every file; install once with
# `uv run pre-commit install` to run them on each commit. They use the project's own ruff
# (uv.lock), so versions match everywhere.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
