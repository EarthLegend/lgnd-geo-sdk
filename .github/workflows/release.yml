# `v*` tags publish to PyPI; `test-v*` tags publish the same build to TestPyPI, to rehearse the
# pipeline without spending a real version number. Either way the tag (minus any `test-`) must
# match the version in pyproject.toml.
# Uses Trusted Publishing (OIDC), so there is no token to store. One-off setup, on each index
# (accounts are separate): add a pending publisher for this repo, workflow `release.yml`,
# environment `pypi` (pypi.org) or `testpypi` (test.pypi.org). Make the `pypi` GitHub
# environment require a reviewer.
name: Release

on:
  push:
    tags:
      - "v*"
      - "test-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the tag against main's history
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv python install
      # A real release ships only reviewed code: the tagged commit must already be on main.
      # test-v* rehearsals may come from any branch.
      - name: Tag is on main
        if: startsWith(github.ref_name, 'v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: uv sync --frozen
      - run: make test
      - name: Tag matches pyproject version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#test-}"
          test "v$version" = "$tag" || { echo "tag $GITHUB_REF_NAME does not match v$version"; exit 1; }
      - run: uv build
      - name: Smoke test the wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "from lgnd_geo_sdk import auth, client; print('ok')"
      # Lets anyone check a wheel came from this repo's release workflow:
      # `gh attestation verify <file> --repo EarthLegend/lgnd-geo-sdk`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: startsWith(github.ref_name, 'test-v')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

  publish-pypi:
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv publish --trusted-publishing always
